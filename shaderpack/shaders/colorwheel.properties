# Colorwheel's programs (Create's machines and contraptions through Flywheel).

# Block cracks multiply the colour under them; the motion vectors under them stay as they are, and so does the
# surface they lie on (the lit overworld's G-buffer, see lib/gbuffer.glsl).
blend.clrwl_gbuffers_damagedblock.colortex7 = ZERO ONE ZERO ONE
blend.clrwl_gbuffers_damagedblock.colortex2 = ZERO ONE ZERO ONE
blend.clrwl_gbuffers_damagedblock.colortex9 = ZERO ONE ZERO ONE
blend.clrwl_gbuffers_damagedblock.colortex12 = ZERO ONE ZERO ONE
blend.clrwl_gbuffers.colortex2 = off
blend.clrwl_gbuffers.colortex9 = off
blend.clrwl_gbuffers.colortex12 = off

# Create's machines in the lit overworld's shadow map (the option in lib/settings.glsl).
#ifdef SHADOW_MACHINES
shadow.enabled = true
#else
shadow.enabled = false
#endif
