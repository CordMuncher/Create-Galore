# Where DLSS (or FSR) goes in this pack, for the Create Galore Bridge (see PackProfile in the Bridge). The pack is
# built around it, so nothing needs patching: composite1.fsh hands everything over and final.fsh shows the result.
pass=composite1
colorAttachment=0
outputAttachments=0
motionImage=cg_motion_img
depthImage=cg_depth_img
exposureImage=cg_exposure_img
renderScaleOptions=UPSCALING,RENDER_SCALE
