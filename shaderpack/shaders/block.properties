# Blocks the lit overworld treats apart (Iris hands the number to the programs as mc_Entity.x).
# 10001: water, which shows little of its own colour and mostly what it reflects and lets through.
block.10001 = minecraft:water
# 10002: leaves (every block with the leaves tag), which the bounce light only partly gets through.
block.10002 = %minecraft:leaves
# 10003: metal that shines: iron, gold, copper until it weathers, netherite, Create's brass, zinc and casings.
block.10003 = minecraft:iron_block minecraft:gold_block minecraft:netherite_block \
    minecraft:copper_block minecraft:exposed_copper minecraft:cut_copper minecraft:exposed_cut_copper \
    minecraft:cut_copper_slab minecraft:exposed_cut_copper_slab minecraft:cut_copper_stairs minecraft:exposed_cut_copper_stairs \
    minecraft:chiseled_copper minecraft:exposed_chiseled_copper \
    minecraft:waxed_copper_block minecraft:waxed_exposed_copper minecraft:waxed_cut_copper minecraft:waxed_exposed_cut_copper \
    minecraft:waxed_cut_copper_slab minecraft:waxed_exposed_cut_copper_slab minecraft:waxed_cut_copper_stairs \
    minecraft:waxed_exposed_cut_copper_stairs minecraft:waxed_chiseled_copper minecraft:waxed_exposed_chiseled_copper \
    minecraft:iron_door:open=true minecraft:iron_trapdoor:open=true \
    minecraft:heavy_weighted_pressure_plate minecraft:light_weighted_pressure_plate \
    minecraft:anvil minecraft:chipped_anvil minecraft:damaged_anvil minecraft:cauldron minecraft:water_cauldron \
    minecraft:lava_cauldron minecraft:powder_snow_cauldron minecraft:hopper minecraft:lightning_rod \
    %c:storage_blocks/iron %c:storage_blocks/gold %c:storage_blocks/copper %c:storage_blocks/netherite \
    %c:storage_blocks/brass %c:storage_blocks/zinc \
    create:brass_block create:zinc_block create:industrial_iron_block create:brass_casing create:copper_casing \
    create:fluid_tank create:item_vault create:copper_shingles create:copper_tiles
# 10004: polished stone and the like, with a soft sheen: polished andesite, diorite, granite, deepslate, blackstone and
# tuff, quartz, glazed terracotta, obsidian, packed and blue ice.
block.10004 = minecraft:polished_andesite minecraft:polished_andesite_slab minecraft:polished_andesite_stairs \
    minecraft:polished_diorite minecraft:polished_diorite_slab minecraft:polished_diorite_stairs \
    minecraft:polished_granite minecraft:polished_granite_slab minecraft:polished_granite_stairs \
    minecraft:polished_deepslate minecraft:polished_deepslate_slab minecraft:polished_deepslate_stairs \
    minecraft:polished_blackstone minecraft:polished_blackstone_slab minecraft:polished_blackstone_stairs \
    minecraft:polished_tuff minecraft:polished_tuff_slab minecraft:polished_tuff_stairs minecraft:polished_basalt \
    minecraft:quartz_block minecraft:quartz_slab minecraft:quartz_stairs minecraft:smooth_quartz \
    minecraft:smooth_quartz_slab minecraft:smooth_quartz_stairs minecraft:quartz_pillar minecraft:quartz_bricks \
    minecraft:chiseled_quartz_block minecraft:obsidian minecraft:packed_ice minecraft:blue_ice \
    minecraft:white_glazed_terracotta minecraft:orange_glazed_terracotta minecraft:magenta_glazed_terracotta \
    minecraft:light_blue_glazed_terracotta minecraft:yellow_glazed_terracotta minecraft:lime_glazed_terracotta \
    minecraft:pink_glazed_terracotta minecraft:gray_glazed_terracotta minecraft:light_gray_glazed_terracotta \
    minecraft:cyan_glazed_terracotta minecraft:purple_glazed_terracotta minecraft:blue_glazed_terracotta \
    minecraft:brown_glazed_terracotta minecraft:green_glazed_terracotta minecraft:red_glazed_terracotta \
    minecraft:black_glazed_terracotta \
    create:polished_cut_andesite create:polished_cut_granite create:polished_cut_diorite create:polished_cut_calcite \
    create:polished_cut_deepslate create:polished_cut_dripstone create:polished_cut_limestone create:polished_cut_tuff \
    create:polished_cut_asurine create:polished_cut_crimsite create:polished_cut_ochrum create:polished_cut_veridium \
    create:polished_cut_scoria create:polished_cut_scorchia
# 10005: soil, which takes most rain in (puddles only in its deepest dips).
block.10005 = minecraft:grass_block minecraft:dirt minecraft:coarse_dirt minecraft:podzol minecraft:mycelium \
    minecraft:rooted_dirt minecraft:moss_block
# 10006: sand, gravel and snow, which take all of it in (damp, never a puddle).
block.10006 = %minecraft:sand minecraft:gravel minecraft:suspicious_gravel minecraft:soul_sand minecraft:soul_soil \
    minecraft:snow minecraft:snow_block minecraft:powder_snow \
    minecraft:white_concrete_powder minecraft:orange_concrete_powder minecraft:magenta_concrete_powder \
    minecraft:light_blue_concrete_powder minecraft:yellow_concrete_powder minecraft:lime_concrete_powder \
    minecraft:pink_concrete_powder minecraft:gray_concrete_powder minecraft:light_gray_concrete_powder \
    minecraft:cyan_concrete_powder minecraft:purple_concrete_powder minecraft:blue_concrete_powder \
    minecraft:brown_concrete_powder minecraft:green_concrete_powder minecraft:red_concrete_powder \
    minecraft:black_concrete_powder
# 10007: closed doors and trapdoors (every block with the doors or trapdoors tag, modded ones too), which stop the
# bounce light as a wall does though they are thin; 10008 the iron ones, metal too. Open, they let it past.
block.10007 = %minecraft:doors:open=false %minecraft:trapdoors:open=false
block.10008 = minecraft:iron_door:open=false minecraft:iron_trapdoor:open=false

# 10101..: lights whose colour the coloured light takes from here rather than from their texture (see
# program/shadow.vsh); every other light, modded ones too, gets its colour from its texture.
# 10101 redstone red
block.10101 = minecraft:redstone_torch minecraft:redstone_wall_torch \
    minecraft:redstone_ore minecraft:deepslate_redstone_ore
# 10102 soul fire blue
block.10102 = minecraft:soul_torch minecraft:soul_wall_torch minecraft:soul_lantern \
    minecraft:soul_campfire minecraft:soul_fire
# 10103 cool white
block.10103 = minecraft:sea_lantern minecraft:beacon minecraft:conduit minecraft:end_rod
# 10104 purple
block.10104 = minecraft:crying_obsidian minecraft:respawn_anchor minecraft:nether_portal \
    minecraft:amethyst_cluster minecraft:large_amethyst_bud minecraft:medium_amethyst_bud \
    minecraft:small_amethyst_bud minecraft:dragon_egg
# 10105 froglight green, 10106 froglight pink
block.10105 = minecraft:verdant_froglight
block.10106 = minecraft:pearlescent_froglight
# 10107 lava and magma orange
block.10107 = minecraft:lava minecraft:magma_block
# 10108 sculk cyan
block.10108 = minecraft:sculk_catalyst minecraft:sculk_sensor minecraft:calibrated_sculk_sensor
# 10109 glow lichen pale green
block.10109 = minecraft:glow_lichen
