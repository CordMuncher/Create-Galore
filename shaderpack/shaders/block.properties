# Blocks the lit overworld treats apart (Iris hands the number to the programs as mc_Entity.x).
# 10001: water, which shows little of its own colour and mostly what it reflects and lets through.
block.10001 = minecraft:water
# 10002: leaves (every block with the leaves tag), which the bounce light only partly gets through.
block.10002 = %minecraft:leaves

# 10101..: lights whose colour the coloured light takes from here rather than from their texture (see
# program/shadow.vsh); every other light, modded ones too, gets its colour from its texture.
# 10101 redstone red
block.10101 = minecraft:redstone_torch minecraft:redstone_wall_torch \
    minecraft:redstone_ore minecraft:deepslate_redstone_ore
# 10102 soul fire blue
block.10102 = minecraft:soul_torch minecraft:soul_wall_torch minecraft:soul_lantern \
    minecraft:soul_campfire minecraft:soul_fire
# 10103 cool white
block.10103 = minecraft:sea_lantern minecraft:beacon minecraft:conduit minecraft:end_rod
# 10104 purple
block.10104 = minecraft:crying_obsidian minecraft:respawn_anchor minecraft:nether_portal \
    minecraft:amethyst_cluster minecraft:large_amethyst_bud minecraft:medium_amethyst_bud \
    minecraft:small_amethyst_bud minecraft:dragon_egg
# 10105 froglight green, 10106 froglight pink
block.10105 = minecraft:verdant_froglight
block.10106 = minecraft:pearlescent_froglight
# 10107 lava and magma orange
block.10107 = minecraft:lava minecraft:magma_block
# 10108 sculk cyan
block.10108 = minecraft:sculk_catalyst minecraft:sculk_sensor minecraft:calibrated_sculk_sensor
# 10109 glow lichen pale green
block.10109 = minecraft:glow_lichen
