# The pack's own sky and light are the overworld's: its programs are in world0/. The Nether and the End are lit by
# their own light (no sun in the Nether, a still light from above in the End) through the same passes, their programs
# in world-1/ and world1/ (the End's sky also in Minecraft's own look). All three are written by dimensions.sh. Every
# other dimension (modded ones) draws with the programs in shaders/ itself, Minecraft's own look and sky: never the
# overworld's.
dimension.world0 = minecraft:overworld
dimension.world-1 = minecraft:the_nether
dimension.world1 = minecraft:the_end
