# The pack's own sky and light are the overworld's: its programs are in world0/. The End has a sky of its own, its
# programs in world1/ (both written by dimensions.sh). Every other dimension (the Nether, modded ones) draws with the
# programs in shaders/ itself, Minecraft's own look and sky: never the overworld's.
dimension.world0 = minecraft:overworld
dimension.world1 = minecraft:the_end
