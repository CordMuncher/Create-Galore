# Create Galore Shaders: drawn for DLSS and FSR from the ground up.
#
# The pure anti-aliasing profile is Minecraft as it is with only DLSS or FSR anti-aliasing on top (DLAA). The others
# (Low to Ultra) light the overworld itself: a physically based sky, the sun's and the moon's light and shadows, tone
# mapped after DLSS (its programs are in world0/, see dimension.properties), and the Nether and the End by their own
# light (world-1/ and world1/), with more of the effects the higher they go, each one built to be upscaled.

iris.features.required = CUSTOM_IMAGES PER_BUFFER_BLENDING COMPUTE_SHADERS SEPARATE_HARDWARE_SAMPLERS

# Minecraft's own block lighting: each face's shading baked into the vertex colours, as vanilla draws them (the lit
# overworld takes it out again, see lib/gbuffer.glsl). With the lighting on, the smooth lighting's corners come in
# the vertex alpha instead (the lit overworld darkens only the light all around by them, every other dimension puts
# them back into the colour: see gbuffers.vsh).
oldLighting = true
#ifdef LIGHTING
separateAo = true
#else
separateAo = false
#endif

# What vanilla draws that Iris leaves to the pack to ask for (the lit overworld draws its own sky instead).
vignette = true
underwaterOverlay = true
sun = true
moon = true
stars = true
sky = true

# Options
# The presets: each step up adds techniques (and only then more samples of them). They leave Upscaling as it is.
profile.PURE_AA = !UPSCALING !LIGHTING !END_SKY
profile.LOW = LIGHTING SHADOWS SHADOW_QUALITY:1 !CONTACT_SHADOWS AO_QUALITY:0 !SCREEN_BOUNCE COLORED_LIGHT LIGHT_RANGE:64 !GI WATER_RIPPLES REFLECTION_QUALITY:1 CLOUDS CLOUD_QUALITY:1 AIR_QUALITY:1 MATERIALS !PARALLAX END_SKY shadowMapResolution:2048
profile.MEDIUM = LIGHTING SHADOWS SHADOW_QUALITY:2 CONTACT_SHADOWS AO_QUALITY:1 SCREEN_BOUNCE COLORED_LIGHT LIGHT_RANGE:128 GI WATER_RIPPLES REFLECTION_QUALITY:2 CLOUDS CLOUD_QUALITY:2 AIR_QUALITY:2 MATERIALS PARALLAX PARALLAX_DISTANCE:24 END_SKY shadowMapResolution:2048
profile.HIGH = LIGHTING SHADOWS SHADOW_QUALITY:3 CONTACT_SHADOWS AO_QUALITY:2 SCREEN_BOUNCE COLORED_LIGHT LIGHT_RANGE:128 GI WATER_RIPPLES REFLECTION_QUALITY:2 CLOUDS CLOUD_QUALITY:3 AIR_QUALITY:3 MATERIALS PARALLAX PARALLAX_DISTANCE:32 END_SKY shadowMapResolution:4096
profile.ULTRA = LIGHTING SHADOWS SHADOW_QUALITY:4 CONTACT_SHADOWS AO_QUALITY:3 SCREEN_BOUNCE COLORED_LIGHT LIGHT_RANGE:192 GI WATER_RIPPLES REFLECTION_QUALITY:3 CLOUDS CLOUD_QUALITY:4 AIR_QUALITY:4 MATERIALS PARALLAX PARALLAX_DISTANCE:48 END_SKY shadowMapResolution:4096
screen = <profile> <empty> UPSCALING RENDER_SCALE NOISE_PATTERN <empty> LIGHTING [LIGHT] SHADOWS [SHADOW] COLORED_LIGHT [COLOR] GI GI_STRENGTH WATER_RIPPLES [WATER] CLOUDS [CLOUD] AIR_QUALITY [AIR] MATERIALS [MATERIAL] END_SKY [END] [NETHER] [GRADE] DEPTH_OF_FIELD [LENS]
screen.LIGHT = EXPOSURE LOCAL_EXPOSURE NIGHT_LIGHT NIGHT_VISION sunPathRotation SKY_FALLOFF BLOCK_FALLOFF EMISSION BLOCK_LIGHT_DAY BLOOM AO_QUALITY SCREEN_BOUNCE
screen.SHADOW = shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_QUALITY CONTACT_SHADOWS SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES SHADOW_PLAYER SHADOW_MACHINES
screen.COLOR = COLORED_LIGHT_SATURATION LIGHT_STYLE LIGHT_RANGE
screen.WATER = WATER_WAVES WATER_RIPPLES_STRENGTH REFLECTION_QUALITY
screen.CLOUD = CLOUD_QUALITY CLOUD_SHADOWS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_WIND <empty> CIRRUS CIRRUS_COVERAGE
screen.AIR = AIR_DUST LAMP_GLOW
screen.MATERIAL = PARALLAX PARALLAX_DEPTH PARALLAX_DISTANCE
screen.END = END_NEBULA END_STARS END_LIGHT END_HAZE
screen.NETHER = NETHER_HAZE HEAT_SHIMMER
screen.GRADE = WB_TEMPERATURE WB_TINT <empty> <empty> PRIMARY_RED_HUE PRIMARY_RED_SAT PRIMARY_GREEN_HUE PRIMARY_GREEN_SAT PRIMARY_BLUE_HUE PRIMARY_BLUE_SAT <empty> <empty> COLOR_MIXER [MIXER]
screen.LENS = DOF_FOCUS DOF_QUALITY DOF_FOCAL_LENGTH DOF_F_STOP
screen.MIXER = MIX_RED_HUE MIX_RED_SAT MIX_RED_LUM MIX_ORANGE_HUE MIX_ORANGE_SAT MIX_ORANGE_LUM MIX_YELLOW_HUE MIX_YELLOW_SAT MIX_YELLOW_LUM MIX_GREEN_HUE MIX_GREEN_SAT MIX_GREEN_LUM MIX_AQUA_HUE MIX_AQUA_SAT MIX_AQUA_LUM MIX_BLUE_HUE MIX_BLUE_SAT MIX_BLUE_LUM MIX_PURPLE_HUE MIX_PURPLE_SAT MIX_PURPLE_LUM MIX_MAGENTA_HUE MIX_MAGENTA_SAT MIX_MAGENTA_LUM
screen.MIXER.columns = 3
sliders = END_LIGHT END_HAZE NETHER_HAZE HEAT_SHIMMER DOF_FOCUS DOF_FOCAL_LENGTH DOF_F_STOP DOF_QUALITY AIR_QUALITY AIR_DUST LAMP_GLOW PARALLAX_DEPTH PARALLAX_DISTANCE SHADOW_QUALITY AO_QUALITY REFLECTION_QUALITY EMISSION BLOCK_LIGHT_DAY BLOOM WATER_WAVES WATER_RIPPLES_STRENGTH COLORED_LIGHT_SATURATION LIGHT_STYLE LIGHT_RANGE GI_STRENGTH END_NEBULA END_STARS RENDER_SCALE EXPOSURE LOCAL_EXPOSURE NIGHT_LIGHT NIGHT_VISION SKY_FALLOFF BLOCK_FALLOFF sunPathRotation shadowMapResolution shadowDistance SHADOW_SOFTNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_WIND CIRRUS_COVERAGE WB_TEMPERATURE WB_TINT PRIMARY_RED_HUE PRIMARY_RED_SAT PRIMARY_GREEN_HUE PRIMARY_GREEN_SAT PRIMARY_BLUE_HUE PRIMARY_BLUE_SAT MIX_RED_HUE MIX_RED_SAT MIX_RED_LUM MIX_ORANGE_HUE MIX_ORANGE_SAT MIX_ORANGE_LUM MIX_YELLOW_HUE MIX_YELLOW_SAT MIX_YELLOW_LUM MIX_GREEN_HUE MIX_GREEN_SAT MIX_GREEN_LUM MIX_AQUA_HUE MIX_AQUA_SAT MIX_AQUA_LUM MIX_BLUE_HUE MIX_BLUE_SAT MIX_BLUE_LUM MIX_PURPLE_HUE MIX_PURPLE_SAT MIX_PURPLE_LUM MIX_MAGENTA_HUE MIX_MAGENTA_SAT MIX_MAGENTA_LUM

# What the composite1 pass hands to DLSS and FSR (see composite1.fsh and create_galore_dlss.properties): motion
# vectors, DLSS depth, and the exposure.
image.cg_motion_img = none rg rg16f half_float false true 1.0 1.0
image.cg_depth_img = none red r32f float false true 1.0 1.0
image.cg_exposure_img = none red r32f float false false 1 1

# The lit overworld's air (see lib/atmosphere.glsl): remade every frame by the begin passes.
image.cg_trans_img = cg_trans_lut rgba rgba16f half_float false false 256 64
image.cg_msctr_img = cg_msctr_lut rgba rgba16f half_float false false 32 32
image.cg_skyview_img = cg_skyview_lut rgba rgba16f half_float false false 256 256
# What its programs share each frame (see lib/globals.glsl).
image.cg_globals_img = cg_globals_tex rgba rgba32f float false false 4096 35
# The coloured light and the bounce light (see lib/light_volume.glsl): what the shadow pass marks in each block around
# you (cleared every frame: what it is, the light it gives, and with bounce light the sunlight bounced into it), and
# the light spreading through them (the coloured light, then with bounce light its colour and each facing's, and the
# trees' crowns), volumes one above another along y, the light's twice along z.
#if defined LIGHTING && defined SHADOWS && (defined COLORED_LIGHT || defined GI)
#ifdef GI
#if LIGHT_RANGE == 64
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 64 224 64
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 64 160 128
#elif LIGHT_RANGE == 192
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 192 672 192
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 192 480 384
#elif LIGHT_RANGE == 256
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 256 896 256
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 256 640 512
#else
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 128 448 128
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 128 320 256
#endif
#else
#if LIGHT_RANGE == 64
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 64 64 64
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 64 64 128
#elif LIGHT_RANGE == 192
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 192 192 192
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 192 192 384
#elif LIGHT_RANGE == 256
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 256 256 256
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 256 256 512
#else
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 128 128 128
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 128 128 256
#endif
#endif
#endif
# The ripples (see lib/water.glsl): their state, two side by side taking turns, and what the shadow pass marks in each
# cell (the water's top, how low and how high anything else reaches; cleared every frame). The lighting also reads the
# water's tops, for how deep under water what it lights lies. Under those marks (from row 1536), the blocks around you
# that the sky's light can't get through, and coarser copies of them (see lib/sky_grid.glsl; Iris allows 16 images in
# all, so they share this one).
#if defined LIGHTING && defined SHADOWS && defined WATER_RIPPLES
image.cg_water_img = cg_water_tex rg rg16f half_float false false 1024 512
#endif
#if defined LIGHTING && defined SHADOWS
image.cg_water_marks_img = cg_water_marks_tex red_integer r32ui unsigned_int true false 512 2940
#endif
# The waves' noise and the curl field that warps it (see lib/water.glsl), from Alpha Piscium (textures/).
customTexture.cg_wave_tex = textures/wave_noise.bin TEXTURE_2D R16 1024 1024 RED UNSIGNED_SHORT
customTexture.cg_wave_curl_tex = textures/wave_curl.bin TEXTURE_2D RG16_SNORM 128 128 RG SHORT
# Minecraft's moon (the resource pack's), for the lit sky's moon phases.
customTexture.cg_moon_tex = minecraft:textures/environment/moon_phases.png

# The clouds (see lib/clouds.glsl): the light around them, this frame's cumulus rays, and the cumulus gathered for
# every pixel with how many frames each holds, two of each side by side taking turns (Iris allows 16 images in all).
# Their shapes and phase functions come from Alpha Piscium (textures/).
image.cg_cloud_amb_img = cg_cloud_amb_tex rgba rgba16f half_float false false 16 16
#if CLOUD_QUALITY == 4
image.cg_cloud_low_img = cg_cloud_low_tex rgba rgba16f half_float false true 1.0 1.0
image.cg_cloud_dist_img = cg_cloud_dist_tex red r16f half_float false true 1.0 1.0
#else
image.cg_cloud_low_img = cg_cloud_low_tex rgba rgba16f half_float false true 0.51 0.51
image.cg_cloud_dist_img = cg_cloud_dist_tex red r16f half_float false true 0.51 0.51
#endif
image.cg_cloud_hist_img = cg_cloud_hist_tex rgba rgba16f half_float false true 2.0 1.0
image.cg_cloud_len_img = cg_cloud_len_tex red r16f half_float false true 2.0 1.0
customTexture.cg_cloud_phase_tex = textures/opac_cloud_phases.bin TEXTURE_2D RGBA16F 256 3 RGBA HALF_FLOAT
customTexture.cg_cirrus_tex = textures/cirrus_20.png
customTexture.cg_cumulus_base_tex = textures/cumulus_base.bin TEXTURE_2D R8 1024 1024 RED UNSIGNED_BYTE
customTexture.cg_cumulus_detail1_tex = textures/cumulus_detail1.bin TEXTURE_3D R8 128 128 128 RED UNSIGNED_BYTE
customTexture.cg_cumulus_detail2_tex = textures/cumulus_detail2.bin TEXTURE_3D R8 128 128 128 RED UNSIGNED_BYTE
customTexture.cg_cumulus_curl_tex = textures/cumulus_curl.bin TEXTURE_3D RGBA8_SNORM 64 64 64 RGBA BYTE

# Rain and snow where you are, faded in over a few seconds as you walk into a biome where they fall, for the lit
# overworld's weather (lib/lit.glsl, lib/wet.glsl, deferred.fsh): the film of water rain leaves on everything (half of
# it there after 8 seconds of rain, half of it gone 15 seconds after), the darkening of what it soaked into, which
# lingers after the shine has gone (half lives of 10 and 40 seconds), and the puddles, which fill over the first half
# minute and shrink back over about four after the rain stops (half lives of 20 and 45 seconds).
# Iris's smooth() takes the time to all but finish (about ten half lives), not the half life: smooth(x, 80, 150) is
# half way after 8 seconds up and 15 down.
uniform.float.cg_rain_here = smooth(rainStrength * if(biome_precipitation == 1, 1.0, 0.0), 3.0, 3.0)
uniform.float.cg_snow_here = smooth(rainStrength * if(biome_precipitation == 2, 1.0, 0.0), 3.0, 3.0)
uniform.float.cg_wet = smooth(rainStrength * if(biome_precipitation == 1, 1.0, 0.0), 80.0, 150.0)
uniform.float.cg_damp = smooth(rainStrength * if(biome_precipitation == 1, 1.0, 0.0), 100.0, 400.0)
uniform.float.cg_puddle = smooth(rainStrength * if(biome_precipitation == 1, 1.0, 0.0), 200.0, 450.0)
# How much of the long waves the water has (see water.glsl): the full swell at sea and on its shores, less on lakes,
# rivers and swamps, changing over a few seconds as you go from one to the other.
# How much thicker the Nether's air is than the wastes' (see nether.glsl), changing over a few seconds as you go from
# one biome to the next: the basalt deltas' ash, the soul sand valley's and the forests' spores.
uniform.float.cg_nether_haze = smooth(if(biome == BIOME_BASALT_DELTAS, 1.7, biome == BIOME_SOUL_SAND_VALLEY, 1.3, biome == BIOME_CRIMSON_FOREST, 1.15, biome == BIOME_WARPED_FOREST, 1.15, 1.0), 5.0, 5.0)
uniform.float.cg_swell = smooth(if(biome_category == CAT_OCEAN, 1.0, biome_category == CAT_BEACH, 0.85, biome_category == CAT_SWAMP, 0.25, biome_category == CAT_RIVER, 0.45, 0.6), 4.0, 4.0)

# The lit overworld's own passes: the air's tables, the frame's light and the light around the clouds (begin), the
# light in the air (prepare, after the shadow map), the cumulus' rays and their gathering, then the lighting
# (deferred), the water (composite, after the translucent things), the exposure (composite2, after DLSS), and the
# shadow map.
program.world0/begin1.enabled = LIGHTING
program.world0/begin2.enabled = LIGHTING
program.world0/begin3.enabled = LIGHTING
program.world0/begin4.enabled = LIGHTING
program.world0/begin5.enabled = LIGHTING && CLOUDS
program.world0/prepare.enabled = LIGHTING
program.world0/prepare1.enabled = LIGHTING
# The light in the air's cells (see air.glsl): this frame's in colortex10 (then their sums), last frame's in
# colortex11, each a page of the volume's slices, 8 side by side: 8 times the window over the cells' size across, the
# rows of slices times it up, and a little more.
#if AIR_QUALITY == 1
size.buffer.colortex10 = 0.53 0.53
size.buffer.colortex11 = 0.53 0.53
#elif AIR_QUALITY == 2
size.buffer.colortex10 = 0.69 1.06
size.buffer.colortex11 = 0.69 1.06
#elif AIR_QUALITY == 3
size.buffer.colortex10 = 1.03 1.56
size.buffer.colortex11 = 1.03 1.56
#elif AIR_QUALITY == 4
size.buffer.colortex10 = 1.37 2.06
size.buffer.colortex11 = 1.37 2.06
#endif
program.world0/deferred.enabled = LIGHTING && CLOUDS
program.world0/deferred1.enabled = LIGHTING && CLOUDS
program.world0/deferred2.enabled = LIGHTING
program.world0/deferred3.enabled = LIGHTING
program.world0/composite.enabled = LIGHTING
program.world0/composite2.enabled = LIGHTING
# The bloom (see bloom.csh): down its pyramid (composite3 to 9) and back up (composite10 to 15), in colortex8, half the
# window wide and as tall.
program.world0/composite3.enabled = LIGHTING
program.world0/composite4.enabled = LIGHTING
program.world0/composite5.enabled = LIGHTING
program.world0/composite6.enabled = LIGHTING
program.world0/composite7.enabled = LIGHTING
program.world0/composite8.enabled = LIGHTING
program.world0/composite9.enabled = LIGHTING
program.world0/composite10.enabled = LIGHTING
program.world0/composite11.enabled = LIGHTING
program.world0/composite12.enabled = LIGHTING
program.world0/composite13.enabled = LIGHTING
program.world0/composite14.enabled = LIGHTING
program.world0/composite15.enabled = LIGHTING
# The local exposure's grid (see local_exposure.csh): built (composite16), then blurred (composite17).
program.world0/composite16.enabled = LIGHTING
program.world0/composite17.enabled = LIGHTING
# The depth of field (see dof.csh): the focus (composite18), the frame and its circles (composite19), the tiles
# (composite20), the blur (composite21).
program.world0/composite18.enabled = LIGHTING && DEPTH_OF_FIELD
program.world0/composite19.enabled = LIGHTING && DEPTH_OF_FIELD
program.world0/composite20.enabled = LIGHTING && DEPTH_OF_FIELD
program.world0/composite21.enabled = LIGHTING && DEPTH_OF_FIELD
size.buffer.colortex8 = 0.5 1.0
# The End's own sky in Minecraft's own look (with the lighting on, the lit End's deferred pass draws it).
program.world1/deferred.enabled = END_SKY && !LIGHTING

program.world0/shadow.enabled = LIGHTING && SHADOWS
program.world0/shadow_solid.enabled = LIGHTING && SHADOWS
program.world0/shadow_cutout.enabled = LIGHTING && SHADOWS
program.world0/shadow_water.enabled = LIGHTING && SHADOWS
program.world0/clrwl_shadow.enabled = LIGHTING && SHADOWS
# After the shadow pass has marked the blocks and the water: a barrier (shadowcomp), the bounce light's source, the
# light flood, the ripples' steps, and the sky grid's coarser copies.
program.world0/shadowcomp.enabled = LIGHTING && SHADOWS
program.world0/shadowcomp1.enabled = LIGHTING && SHADOWS && GI
program.world0/shadowcomp2.enabled = LIGHTING && SHADOWS && (COLORED_LIGHT || GI)
program.world0/shadowcomp3.enabled = LIGHTING && SHADOWS && WATER_RIPPLES
program.world0/shadowcomp4.enabled = LIGHTING && SHADOWS && WATER_RIPPLES
program.world0/shadowcomp5.enabled = LIGHTING && SHADOWS && WATER_RIPPLES
program.world0/shadowcomp6.enabled = LIGHTING && SHADOWS
program.world0/shadowcomp7.enabled = LIGHTING && SHADOWS

