# Create Galore Shaders: Minecraft's own look, drawn for DLSS and FSR from the ground up.
#
# The pure anti-aliasing profile is Minecraft as it is with only DLSS or FSR anti-aliasing on top (DLAA). Effects
# join later as options, each one built to be upscaled.

iris.features.required = CUSTOM_IMAGES PER_BUFFER_BLENDING

# Minecraft's own block lighting: each face's shading and the smooth lighting's corners baked into the vertex
# colours, as vanilla draws them.
oldLighting = true
separateAo = false

# What vanilla draws that Iris leaves to the pack to ask for.
vignette = true
underwaterOverlay = true
sun = true
moon = true
stars = true
sky = true

# Options
profile.PURE_AA = !UPSCALING
screen = <profile> <empty> UPSCALING RENDER_SCALE
sliders = RENDER_SCALE

# What the composite pass hands to DLSS and FSR (see composite.fsh and create_galore_dlss.properties): motion
# vectors, DLSS depth, and the exposure.
image.cg_motion_img = none rg rg16f half_float false true 1.0 1.0
image.cg_depth_img = none red r32f float false true 1.0 1.0
image.cg_exposure_img = none red r32f float false false 1 1

# Block cracks multiply the colour under them; the motion vectors under them stay as they are.
blend.gbuffers_damagedblock.colortex7 = ZERO ONE ZERO ONE
