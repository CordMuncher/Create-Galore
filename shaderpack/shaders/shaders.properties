# Create Galore Shaders: drawn for DLSS and FSR from the ground up.
#
# The pure anti-aliasing profile is Minecraft as it is with only DLSS or FSR anti-aliasing on top (DLAA). The sky
# profile lights the overworld itself: a physically based sky, the sun's and the moon's light and shadows, tone
# mapped after DLSS (its programs are in world0/, see dimension.properties). Effects join later as options, each one
# built to be upscaled.

iris.features.required = CUSTOM_IMAGES PER_BUFFER_BLENDING COMPUTE_SHADERS

# Minecraft's own block lighting: each face's shading and the smooth lighting's corners baked into the vertex
# colours, as vanilla draws them (the lit overworld takes the face shading out again, see lib/lit.glsl).
oldLighting = true
separateAo = false

# What vanilla draws that Iris leaves to the pack to ask for (the lit overworld draws its own sky instead).
vignette = true
underwaterOverlay = true
sun = true
moon = true
stars = true
sky = true

# Options
profile.PURE_AA = !UPSCALING !LIGHTING !END_SKY
profile.SKY = !UPSCALING LIGHTING SHADOWS COLORED_LIGHT GI WATER_RIPPLES CLOUDS END_SKY
screen = <profile> <empty> UPSCALING RENDER_SCALE <empty> <empty> LIGHTING [LIGHT] SHADOWS [SHADOW] COLORED_LIGHT [COLOR] GI GI_STRENGTH WATER_RIPPLES [WATER] CLOUDS [CLOUD] END_SKY [END]
screen.LIGHT = EXPOSURE NIGHT_LIGHT sunPathRotation SKY_FALLOFF
screen.SHADOW = shadowMapResolution shadowDistance SHADOW_SOFTNESS <empty> SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES SHADOW_PLAYER SHADOW_MACHINES
screen.COLOR = COLORED_LIGHT_SATURATION LIGHT_RANGE
screen.WATER = WATER_WAVES WATER_RIPPLES_STRENGTH
screen.CLOUD = CLOUD_QUALITY CLOUD_SHADOWS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_WIND <empty> CIRRUS CIRRUS_COVERAGE
screen.END = END_NEBULA END_STARS
sliders = WATER_WAVES WATER_RIPPLES_STRENGTH COLORED_LIGHT_SATURATION LIGHT_RANGE GI_STRENGTH END_NEBULA END_STARS RENDER_SCALE EXPOSURE NIGHT_LIGHT SKY_FALLOFF sunPathRotation shadowMapResolution shadowDistance SHADOW_SOFTNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_WIND CIRRUS_COVERAGE

# What the composite pass hands to DLSS and FSR (see composite.fsh and create_galore_dlss.properties): motion
# vectors, DLSS depth, and the exposure.
image.cg_motion_img = none rg rg16f half_float false true 1.0 1.0
image.cg_depth_img = none red r32f float false true 1.0 1.0
image.cg_exposure_img = none red r32f float false false 1 1

# The lit overworld's air (see lib/atmosphere.glsl): remade every frame by the begin passes.
image.cg_trans_img = cg_trans_lut rgba rgba16f half_float false false 256 64
image.cg_msctr_img = cg_msctr_lut rgba rgba16f half_float false false 32 32
image.cg_skyview_img = cg_skyview_lut rgba rgba16f half_float false false 256 256
# What its programs share each frame (see lib/globals.glsl).
image.cg_globals_img = cg_globals_tex rgba rgba32f float false false 32 1
# The coloured light and the bounce light (see lib/light_volume.glsl): what the shadow pass marks in each block around
# you (cleared every frame: what it is, the light it gives, and with bounce light the sunlight bounced into it), and
# the light spreading through them (the coloured light, then with bounce light its colour and each facing's), volumes
# one above another along y, the light's twice along z.
#if defined LIGHTING && defined SHADOWS && (defined COLORED_LIGHT || defined GI)
#ifdef GI
#if LIGHT_RANGE == 64
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 64 224 64
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 64 128 128
#elif LIGHT_RANGE == 192
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 192 672 192
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 192 384 384
#elif LIGHT_RANGE == 256
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 256 896 256
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 256 512 512
#else
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 128 448 128
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 128 256 256
#endif
#else
#if LIGHT_RANGE == 64
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 64 64 64
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 64 32 128
#elif LIGHT_RANGE == 192
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 192 192 192
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 192 96 384
#elif LIGHT_RANGE == 256
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 256 256 256
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 256 128 512
#else
image.cg_voxel_img = none red_integer r32ui unsigned_int true false 128 128 128
image.cg_light_img = cg_light_tex rgb r11f_g11f_b10f float false false 128 64 256
#endif
#endif
#endif
# The ripples (see lib/water.glsl): their state, two side by side taking turns, and what the shadow pass marks in each
# cell (the water's top, how low and how high anything else reaches; cleared every frame).
#if defined LIGHTING && defined SHADOWS && defined WATER_RIPPLES
image.cg_water_img = cg_water_tex rg rg16f half_float false false 1024 512
image.cg_water_marks_img = none red_integer r32ui unsigned_int true false 512 1536
#endif
# Minecraft's moon (the resource pack's), for the lit sky's moon phases.
customTexture.cg_moon_tex = minecraft:textures/environment/moon_phases.png

# The clouds (see lib/clouds.glsl): the light around them, this frame's cumulus rays, and the cumulus gathered for
# every pixel with how many frames each holds, two of each side by side taking turns (Iris allows 16 images in all).
# Their shapes and phase functions come from Alpha Piscium (textures/).
image.cg_cloud_amb_img = cg_cloud_amb_tex rgba rgba16f half_float false false 16 16
#if CLOUD_QUALITY == 4
image.cg_cloud_low_img = cg_cloud_low_tex rgba rgba16f half_float false true 1.0 1.0
image.cg_cloud_dist_img = cg_cloud_dist_tex red r16f half_float false true 1.0 1.0
#else
image.cg_cloud_low_img = cg_cloud_low_tex rgba rgba16f half_float false true 0.51 0.51
image.cg_cloud_dist_img = cg_cloud_dist_tex red r16f half_float false true 0.51 0.51
#endif
image.cg_cloud_hist_img = cg_cloud_hist_tex rgba rgba16f half_float false true 2.0 1.0
image.cg_cloud_len_img = cg_cloud_len_tex red r16f half_float false true 2.0 1.0
customTexture.cg_cloud_phase_tex = textures/opac_cloud_phases.bin TEXTURE_2D RGBA16F 256 3 RGBA HALF_FLOAT
customTexture.cg_cirrus_tex = textures/cirrus_20.png
customTexture.cg_cumulus_base_tex = textures/cumulus_base.bin TEXTURE_2D R8 1024 1024 RED UNSIGNED_BYTE
customTexture.cg_cumulus_detail1_tex = textures/cumulus_detail1.bin TEXTURE_3D R8 128 128 128 RED UNSIGNED_BYTE
customTexture.cg_cumulus_detail2_tex = textures/cumulus_detail2.bin TEXTURE_3D R8 128 128 128 RED UNSIGNED_BYTE
customTexture.cg_cumulus_curl_tex = textures/cumulus_curl.bin TEXTURE_3D RGBA8_SNORM 64 64 64 RGBA BYTE

# Rain and snow where you are, faded in over a few seconds as you walk into a biome where they fall (and wet
# surfaces, drying more slowly), for the lit overworld's weather (lib/lit.glsl, deferred.fsh).
uniform.float.cg_rain_here = smooth(rainStrength * if(biome_precipitation == 1, 1.0, 0.0), 3.0, 3.0)
uniform.float.cg_snow_here = smooth(rainStrength * if(biome_precipitation == 2, 1.0, 0.0), 3.0, 3.0)
uniform.float.cg_wet = smooth(wetness * if(biome_precipitation == 1, 1.0, 0.0), 3.0, 20.0)

# The lit overworld's own passes: the air's tables, the frame's light and the light around the clouds (begin), the
# cumulus' rays and their gathering, then the lighting (deferred), the exposure (composite1, after DLSS), and the
# shadow map.
program.world0/begin1.enabled = LIGHTING
program.world0/begin2.enabled = LIGHTING
program.world0/begin3.enabled = LIGHTING
program.world0/begin4.enabled = LIGHTING
program.world0/begin5.enabled = LIGHTING && CLOUDS
program.world0/deferred.enabled = LIGHTING && CLOUDS
program.world0/deferred1.enabled = LIGHTING && CLOUDS
program.world0/deferred2.enabled = LIGHTING
program.world0/composite1.enabled = LIGHTING
# The End's own sky.
program.world1/deferred.enabled = END_SKY

program.world0/shadow.enabled = LIGHTING && SHADOWS
program.world0/shadow_solid.enabled = LIGHTING && SHADOWS
program.world0/shadow_cutout.enabled = LIGHTING && SHADOWS
program.world0/shadow_water.enabled = LIGHTING && SHADOWS
program.world0/clrwl_shadow.enabled = LIGHTING && SHADOWS
# After the shadow pass has marked the blocks and the water: a barrier (shadowcomp), the bounce light's source, the
# light flood, and the ripples' steps.
program.world0/shadowcomp.enabled = LIGHTING && SHADOWS && (COLORED_LIGHT || GI || WATER_RIPPLES)
program.world0/shadowcomp1.enabled = LIGHTING && SHADOWS && GI
program.world0/shadowcomp2.enabled = LIGHTING && SHADOWS && (COLORED_LIGHT || GI)
program.world0/shadowcomp3.enabled = LIGHTING && SHADOWS && WATER_RIPPLES
program.world0/shadowcomp4.enabled = LIGHTING && SHADOWS && WATER_RIPPLES
program.world0/shadowcomp5.enabled = LIGHTING && SHADOWS && WATER_RIPPLES

# What casts shadows (Distant Horizons' terrain is past the shadow map's reach).
#ifdef SHADOW_ENTITIES
shadowEntities = true
#else
shadowEntities = false
#endif
#ifdef SHADOW_BLOCK_ENTITIES
shadowBlockEntities = true
#else
shadowBlockEntities = false
#endif
#ifdef SHADOW_PLAYER
shadowPlayer = true
#else
shadowPlayer = false
#endif
dhShadow.enabled = false

# Block cracks multiply the colour under them; the motion vectors under them stay as they are, and so does the
# surface they lie on.
blend.gbuffers_damagedblock.colortex7 = ZERO ONE ZERO ONE
blend.gbuffers_damagedblock.colortex2 = ZERO ONE ZERO ONE

# The lit overworld's surfaces (see lib/gbuffer.glsl): written by their own alpha, 1 or 0, so a draw over another
# surface leaves it as it was.
blend.gbuffers_terrain.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_entities.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_block.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_hand.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_beaconbeam.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_particles.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_textured.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_textured_lit.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_basic.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.dh_terrain.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.dh_generic.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
