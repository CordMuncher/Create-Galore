# The shadow pass draws every chunk section within the shadow distance, not only those Iris works out could shadow
# what you see: it also marks what every block around you is, for the coloured light and the bounce light (see
# light_volume.glsl), and a block it leaves out lets the light through (light leaking into closed rooms and capped
# shafts). ("false" is Iris's distance-only culling. It picks that by itself for packs whose shadow pass writes to
# images, as this one's does, but says so here in case that ever changes.)
shadow.culling = false

# What casts shadows (Distant Horizons' terrain is past the shadow map's reach).
#ifdef SHADOW_ENTITIES
shadowEntities = true
#else
shadowEntities = false
#endif
#ifdef SHADOW_BLOCK_ENTITIES
shadowBlockEntities = true
#else
shadowBlockEntities = false
#endif
#ifdef SHADOW_PLAYER
shadowPlayer = true
#else
shadowPlayer = false
#endif
dhShadow.enabled = false

# Translucent blocks in the shadow map add to the colour and facing under them (nothing, but water's mark, see
# shadow.fsh), so the bounce light still sees the floor of a pool or under a glass roof.
blend.shadow_water.colortex0 = ONE ONE ONE ONE
blend.shadow_water.colortex1 = ONE ONE ONE ONE

# Block cracks multiply the colour under them; the motion vectors under them stay as they are, and so does the
# surface they lie on.
blend.gbuffers_damagedblock.colortex7 = ZERO ONE ZERO ONE
blend.gbuffers_damagedblock.colortex2 = ZERO ONE ZERO ONE
blend.gbuffers_damagedblock.colortex9 = ZERO ONE ZERO ONE
blend.gbuffers_damagedblock.colortex12 = ZERO ONE ZERO ONE

# The lit overworld's surfaces (see lib/gbuffer.glsl): written by their own alpha, 1 or 0, so a draw over another
# surface leaves it as it was.
blend.gbuffers_terrain.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_entities.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_block.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_hand.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
