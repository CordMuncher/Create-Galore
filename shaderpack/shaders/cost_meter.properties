# The Create Galore Bridge's cost meter (F10 in game; its log is logs/create-galore-cost.log): each pass's GPU time,
# gathered here into the pack's effects, so each preset's cost reads against its budget (see shaders.properties).
# group.<Name> = the parts it adds up: Iris's program names (no world0/ in front), shadow for the shadow map's
# drawing, gbuffers:<phase> for the world's, and final, dlss and fsr. A part ending in * is a prefix.

# The sky's air tables and the frame's light.
group.Sky = begin begin1 begin2 begin3 begin4
# The clouds: the light around them, their march and its gather.
group.Clouds = begin5 deferred deferred1
# The light in the air's cells and their sums.
group.Air = prepare prepare1
# The shadow map, drawn from the sun (or the moon).
group.ShadowMap = shadow
# The coloured light and the bounce light spreading through the blocks around you.
group.LightVolume = shadowcomp shadowcomp1 shadowcomp2
# The sky grid's inside of the ground, its coarser copies, and the sky each block sees.
group.SkyVisibility = shadowcomp6 shadowcomp7 shadowcomp8 shadowcomp11
# The ripples, the shore and the water's own pass.
group.Water = shadowcomp3 shadowcomp4 shadowcomp5 shadowcomp9 shadowcomp10 composite
# The ambient occlusion and the screen's bounce light.
group.AO = deferred2
# The lighting of every surface.
group.Lighting = deferred3
# The world's own drawing: terrain, entities, the hand, particles.
group.World = gbuffers:*
# What DLSS and FSR take (motion, depth), and DLSS or FSR themselves.
group.Upscaler = composite1 dlss fsr
# The exposure and the local exposure.
group.Exposure = composite2 composite16 composite17
# The bloom's pyramid, down and back up.
group.Bloom = composite3 composite4 composite5 composite6 composite7 composite8 composite9 composite10 composite11 composite12 composite13 composite14 composite15
# The depth of field.
group.DepthOfField = composite18 composite19 composite20 composite21
# The tone mapping and colour, at the window's size.
group.Final = final
