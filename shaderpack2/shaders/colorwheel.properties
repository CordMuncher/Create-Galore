# Colorwheel's programs (Create's machines and contraptions through Flywheel; see program/gbuffers.vsh and .fsh).

# Into the G-buffer as they are, like any block.
blend.clrwl_gbuffers.colortex1 = off
blend.clrwl_gbuffers.colortex2 = off
blend.clrwl_gbuffers.colortex3 = off
blend.clrwl_gbuffers.colortex4 = off
blend.clrwl_gbuffers.colortex7 = off

# Their see-through parts, lit over the lit scene: premultiplied, as the world's (see shaders.properties).
blend.clrwl_gbuffers_translucent.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.clrwl_gbuffers_translucent.colortex7 = off

# Light added to what is there.
blend.clrwl_gbuffers_glint.colortex0 = ONE ONE ZERO ONE
blend.clrwl_gbuffers_additive.colortex0 = ONE ONE ZERO ONE
blend.clrwl_gbuffers_lightning.colortex0 = ONE ONE ZERO ONE

# The block breaking cracks multiply the surface's colour.
blend.clrwl_gbuffers_damagedblock.colortex1 = DST_COLOR SRC_COLOR ZERO ONE

# Create's machines in the shadow map (the option in lib/settings.glsl).
#ifdef SHADOW_MACHINES
shadow.enabled = true
#else
shadow.enabled = false
#endif
