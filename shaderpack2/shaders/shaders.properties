# Create Galore Shaders 2: a traditional shader pack lit by traced coloured light, built for DLSS and FSR.
#
# The world around you is copied into a voxel grid during the shadow pass; every block light (from block.properties,
# or any block Minecraft says gives light) is traced through it to each block and each pixel, the sky and the sun
# bounce off what the grid holds, and the sun casts its shadows from a shadow map. The overworld and every modded
# dimension use the programs in this folder; the Nether and the End theirs in world-1/ and world1/ (see
# dimension.properties). programs.py writes every program file here and there from program/.

iris.features.required = CUSTOM_IMAGES PER_BUFFER_BLENDING COMPUTE_SHADERS SEPARATE_HARDWARE_SAMPLERS

# The terrain's colours come without Minecraft's face shading (the sun and the sky shade the faces), and the smooth
# lighting's corners come in the vertex alpha.
oldLighting = false
separateAo = true

# What Minecraft draws that the pack draws its own way: the sky, the sun, the stars, the vignette and the water
# overlay. The moon stays (the pack lights it).
sun = false
moon = true
stars = false
vignette = false
underwaterOverlay = false

# Particles come after the deferred pass, lit by their own program.
particles.ordering = AFTER

# Options
profile.LOW = VOXEL_BOX:0 PIXEL_LIGHT_SCALE:4 PIXEL_LIGHT_TRACES:16 GI_RAYS:3 shadowMapResolution:1024 shadowDistance:96.0
profile.DEFAULT = VOXEL_BOX:1 PIXEL_LIGHT_SCALE:3 PIXEL_LIGHT_TRACES:32 GI_RAYS:7 shadowMapResolution:2048 shadowDistance:128.0
profile.HIGH = VOXEL_BOX:2 PIXEL_LIGHT_SCALE:2 PIXEL_LIGHT_TRACES:64 GI_RAYS:13 shadowMapResolution:4096 shadowDistance:192.0
screen = <profile> <empty> UPSCALING RENDER_SCALE <empty> <empty> [LIGHT] [SHADOW] [LOOK] [VOXEL] <empty> <empty> DEBUG_VIEW
screen.LIGHT = BLOCK_LIGHT_REACH BLOCK_LIGHT_STRENGTH LIGHT_SATURATION HAND_LIGHT PIXEL_LIGHT PIXEL_LIGHT_SCALE PIXEL_LIGHT_TRACES LIGHT_SPECULAR GI GI_RAYS GI_STRENGTH <empty> SSAO AO_STRENGTH
screen.SHADOW = shadowMapResolution shadowDistance sunPathRotation SHADOW_SOFTNESS SHADOW_ENTITIES SHADOW_BLOCK_ENTITIES SHADOW_MACHINES
screen.LOOK = EXPOSURE BLOOM_STRENGTH LIGHT_FOG SATURATION NIGHT_BRIGHTNESS CAVE_BRIGHTNESS
screen.VOXEL = VOXEL_BOX VOXEL_LEVELS
sliders = RENDER_SCALE BLOCK_LIGHT_REACH BLOCK_LIGHT_STRENGTH LIGHT_SATURATION PIXEL_LIGHT_SCALE PIXEL_LIGHT_TRACES GI_RAYS GI_STRENGTH AO_STRENGTH shadowMapResolution shadowDistance sunPathRotation SHADOW_SOFTNESS EXPOSURE BLOOM_STRENGTH LIGHT_FOG SATURATION NIGHT_BRIGHTNESS CAVE_BRIGHTNESS VOXEL_BOX VOXEL_LEVELS DEBUG_VIEW

# The passes that only some options need.
program.deferred.enabled = PIXEL_LIGHT
program.deferred1.enabled = PIXEL_LIGHT
program.shadowcomp3.enabled = GI
program.world-1/deferred.enabled = PIXEL_LIGHT
program.world-1/deferred1.enabled = PIXEL_LIGHT
program.world-1/shadowcomp3.enabled = GI
program.world1/deferred.enabled = PIXEL_LIGHT
program.world1/deferred1.enabled = PIXEL_LIGHT
program.world1/shadowcomp3.enabled = GI

# --- The shadow pass ---------------------------------------------------------------------------------------------------

# Every chunk in reach goes through the shadow pass, not only those the sun sees: the voxel copy needs them all
# (shadowDistance has to reach past the voxel box, which the presets keep to).
shadow.culling = false
#ifdef SHADOW_ENTITIES
shadowEntities = true
shadowPlayer = true
#else
shadowEntities = false
shadowPlayer = false
#endif
#ifdef SHADOW_BLOCK_ENTITIES
shadowBlockEntities = true
#else
shadowBlockEntities = false
#endif
# The nearest see-through thing's colour wins (see shadow.fsh).
blend.shadow_water = off

# --- Images ------------------------------------------------------------------------------------------------------------
# No storage buffers: Iris takes them only at bindings 0 to 8, and Flywheel (Create's machines through Colorwheel) binds
# its own at 0 to 9 every frame, so everything lives in images (Iris takes at most 16).

# The frame's values (lib/globals.glsl, written by program/frame.csh).
image.cg_globals_img = cg_globals_tex rgba rgba32f float false false 8 1

# The air's tables, side by side (lib/atmosphere.glsl): transmittance and multiple scattering once, the sky view every
# frame (the sun's sky over the moon's).
image.cg_sky_img = cg_sky_tex rgba rgba16f half_float false false 256 312

# Words the passes share (lib/data.glsl): the light hash, each 8-block tile's light list, each screen tile's light
# list (enough for 4K at full detail).
image.cg_data_img = none red_integer r32ui unsigned_int false false 4096 1688

# The voxel copy (lib/voxel.glsl, lib/trace.glsl): what each cell holds with the colours drawn into it beside it,
# remade every frame; the distance field, its detail levels stacked upwards; the light per block, and the bounce light
# per block with its sample count beside it, kept from frame to frame.
#if VOXEL_BOX == 0
image.cg_vox_img = none red_integer r32ui unsigned_int true false 288 64 96
image.cg_sdf_img = none red_integer r8ui unsigned_byte false false 96 384 96
image.cg_blk_img = cg_blk_tex rgba rgba16f half_float false false 96 64 96
image.cg_gi_img = cg_gi_tex rgba rgba16f half_float false false 192 64 96
#elif VOXEL_BOX == 2
image.cg_vox_img = none red_integer r32ui unsigned_int true false 768 128 256
image.cg_sdf_img = none red_integer r8ui unsigned_byte false false 256 768 256
image.cg_blk_img = cg_blk_tex rgba rgba16f half_float false false 256 128 256
image.cg_gi_img = cg_gi_tex rgba rgba16f half_float false false 512 128 256
#else
image.cg_vox_img = none red_integer r32ui unsigned_int true false 384 96 128
image.cg_sdf_img = none red_integer r8ui unsigned_byte false false 128 576 128
image.cg_blk_img = cg_blk_tex rgba rgba16f half_float false false 128 96 128
image.cg_gi_img = cg_gi_tex rgba rgba16f half_float false false 256 96 128
#endif

# The traced light per pixel (program/pixel_light.csh): one sample per PIXEL_LIGHT_SCALE squared pixels, the diffuse
# light on the left and the highlights on the right.
#if PIXEL_LIGHT_SCALE == 1
image.cg_pl_img = none rgba rgba16f half_float false true 2.0 1.0
#elif PIXEL_LIGHT_SCALE == 2
image.cg_pl_img = none rgba rgba16f half_float false true 1.02 0.51
#elif PIXEL_LIGHT_SCALE == 4
image.cg_pl_img = none rgba rgba16f half_float false true 0.52 0.26
#elif PIXEL_LIGHT_SCALE == 6
image.cg_pl_img = none rgba rgba16f half_float false true 0.34 0.17
#else
image.cg_pl_img = none rgba rgba16f half_float false true 0.68 0.34
#endif
# Filtered at the render size (program/pixel_light_filter.csh): the diffuse light, the highlights and the facing and
# depth one above the other, each with this frame's and last frame's side by side.
image.cg_plh_img = none rgba rgba16f half_float false true 2.0 3.0

# The bloom's levels, stacked, the way down on the left and the way back up on the right (lib/bloom.glsl).
image.cg_bloom_img = cg_bloom_tex rgba rgba16f half_float false true 1.02 1.0

# What the composite1 pass hands to DLSS and FSR (see dlss.fsh and create_galore_dlss.properties).
image.cg_motion_img = none rg rg16f half_float false true 1.0 1.0
image.cg_depth_img = none red r32f float false true 1.0 1.0
image.cg_exposure_img = none red r32f float false false 1 1

# --- Blending ----------------------------------------------------------------------------------------------------------

# The G-buffer is written as it is: a blend would mix normals and materials.
blend.gbuffers_terrain = off
blend.gbuffers_entities = off
blend.gbuffers_block = off
blend.gbuffers_hand = off
blend.dh_terrain = off
blend.dh_generic = off

# Lit after the deferred pass, over the lit scene: colours premultiplied by their alpha; their motion vectors replace
# what is under them.
blend.gbuffers_water.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex7 = off
blend.gbuffers_hand_water.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex7 = off
blend.gbuffers_particles.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles.colortex7 = off
blend.gbuffers_textured.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured.colortex7 = off
blend.gbuffers_textured_lit.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex7 = off
blend.gbuffers_weather.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex7 = off
blend.gbuffers_clouds.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds.colortex7 = off
blend.gbuffers_basic.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_basic.colortex7 = off
blend.dh_water.colortex0 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Light added to what is there.
blend.gbuffers_spidereyes = ONE ONE ZERO ONE
blend.gbuffers_armor_glint = ONE ONE ZERO ONE
blend.gbuffers_lightning = ONE ONE ZERO ONE
blend.gbuffers_beaconbeam = ONE ONE ZERO ONE
blend.gbuffers_skytextured = ONE ONE ONE ONE

# The block breaking cracks multiply the surface's colour (twice over, as Minecraft does) and leave what it is.
blend.gbuffers_damagedblock.colortex1 = DST_COLOR SRC_COLOR ZERO ONE
