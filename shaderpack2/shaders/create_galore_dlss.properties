# Where DLSS (or FSR) goes in this pack, for the Create Galore Bridge (see PackProfile in the Bridge). The pack is
# built around it, so nothing needs patching: composite2 (program/dlss.fsh) hands everything over and the final
# pass (program/final.fsh) shows the result.
pass=composite2
colorAttachment=0
outputAttachments=0
motionImage=cg_motion_img
depthImage=cg_depth_img
exposureImage=cg_exposure_img
# The render resolution is the Bridge's own (its Upscaling & Display screen): the pack draws at taau_render_scale,
# which is 1 whenever nothing upscales.
renderScale=bridge
# What the screen offers with this pack: DLSS and FSR, frame generation on top, and their render resolution. Not Ray
# Reconstruction (no guide images yet: the pack still denoises its own light, see the README) and no upscaler of its
# own; anything not listed is greyed out there.
supports=dlss,fsr,frameGeneration,renderResolution
