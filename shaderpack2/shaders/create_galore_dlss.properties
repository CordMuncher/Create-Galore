# Where DLSS (or FSR) goes in this pack, for the Create Galore Bridge (see PackProfile in the Bridge). The pack is
# built around it, so nothing needs patching: composite1 (program/dlss.fsh) hands everything over and the final
# pass (program/final.fsh) shows the result.
pass=composite1
colorAttachment=0
outputAttachments=0
motionImage=cg_motion_img
depthImage=cg_depth_img
exposureImage=cg_exposure_img
# The render resolution is the Bridge's own (its Upscaling & Display screen): the pack draws at taau_render_scale,
# which is 1 whenever nothing upscales.
renderScale=bridge
