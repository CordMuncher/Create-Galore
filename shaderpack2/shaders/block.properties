# Blocks the pack treats apart (Iris hands the number to the programs as mc_Entity.x). Every other block is plain.

# 1: water.
block.1 = minecraft:water

# 2: plants: cross-shaped plants, grass, flowers, crops and vines. Light goes through them softly (subsurface), and
# they stay out of the voxel copy of the world, so they don't turn the block light into noise.
block.2 = minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dead_bush \
    minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet \
    minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy \
    minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose minecraft:sunflower minecraft:lilac \
    minecraft:rose_bush minecraft:peony minecraft:torchflower minecraft:pitcher_plant minecraft:pink_petals \
    minecraft:oak_sapling minecraft:spruce_sapling minecraft:birch_sapling minecraft:jungle_sapling \
    minecraft:acacia_sapling minecraft:dark_oak_sapling minecraft:cherry_sapling minecraft:mangrove_propagule \
    minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:sweet_berry_bush \
    minecraft:torchflower_crop minecraft:pitcher_crop minecraft:nether_wart minecraft:melon_stem minecraft:pumpkin_stem \
    minecraft:attached_melon_stem minecraft:attached_pumpkin_stem minecraft:vine minecraft:cave_vines:berries=false \
    minecraft:cave_vines_plant:berries=false minecraft:weeping_vines minecraft:weeping_vines_plant minecraft:twisting_vines \
    minecraft:twisting_vines_plant minecraft:hanging_roots minecraft:seagrass \
    minecraft:tall_seagrass minecraft:kelp minecraft:kelp_plant minecraft:sugar_cane minecraft:bamboo_sapling \
    minecraft:crimson_roots minecraft:warped_roots minecraft:nether_sprouts minecraft:crimson_fungus \
    minecraft:warped_fungus minecraft:brown_mushroom minecraft:red_mushroom minecraft:small_dripleaf \
    minecraft:spore_blossom minecraft:mangrove_roots minecraft:cobweb minecraft:lily_pad \
    %minecraft:small_flowers %minecraft:tall_flowers %minecraft:saplings %minecraft:crops %minecraft:replaceable_by_trees

# 3: leaves: light goes through them softly, and the voxel copy keeps them.
block.3 = %minecraft:leaves minecraft:azalea minecraft:flowering_azalea

# 5: metal that shines: iron, gold, copper until it weathers, netherite, Create's brass and zinc.
block.5 = minecraft:iron_block minecraft:gold_block minecraft:netherite_block minecraft:copper_block \
    minecraft:cut_copper minecraft:waxed_copper_block minecraft:waxed_cut_copper minecraft:iron_bars minecraft:chain \
    minecraft:anvil minecraft:chipped_anvil minecraft:damaged_anvil minecraft:cauldron minecraft:hopper \
    minecraft:heavy_weighted_pressure_plate minecraft:light_weighted_pressure_plate minecraft:lightning_rod \
    minecraft:iron_door minecraft:iron_trapdoor \
    create:brass_block create:zinc_block create:industrial_iron_block create:brass_casing create:copper_casing

# 6: polished stone and the like, with a soft sheen.
block.6 = minecraft:polished_andesite minecraft:polished_diorite minecraft:polished_granite \
    minecraft:polished_deepslate minecraft:polished_blackstone minecraft:polished_tuff minecraft:quartz_block \
    minecraft:smooth_quartz minecraft:quartz_pillar minecraft:quartz_bricks minecraft:obsidian \
    minecraft:packed_ice minecraft:blue_ice minecraft:ice %minecraft:terracotta

