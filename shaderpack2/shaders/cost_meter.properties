# The Create Galore Bridge's cost meter (F10 in game; its log is logs/create-galore-cost.log): each pass's GPU time,
# gathered here into the pack's effects. group.<Name> = the parts it adds up: Iris's program names (no world folder
# in front), shadow for the shadow pass's drawing, gbuffers:<phase> for the world's, and final, dlss and fsr. A part
# ending in * is a prefix.

# The air's tables and the frame's light.
group.Sky = setup setup1 begin begin2
# The sun's shadow map.
group.Shadow = shadow
# The voxel copy from the Bridge's block grid, with its lights, then its distance field.
group.Voxels = begin1 begin3 shadowcomp shadowcomp1
# The traced block light per block.
group.BlockLight = shadowcomp2
# The traced block light per pixel, and its filter.
group.PixelLight = deferred deferred1
# The bounce light per block.
group.BounceLight = shadowcomp3
# The clouds.
group.Clouds = deferred3
# The lighting of every surface.
group.Lighting = deferred4
# The world's own drawing: terrain, entities, the hand, water, particles.
group.World = gbuffers:*
# The caustics under water, the water's reflection and the sun's shafts in it (a compute-only pass is named by its
# first program running).
group.Water = deferred2 composite composite_a composite_b
# The light fog, the haze and the water around you.
group.Fog = composite1
# What DLSS and FSR take (motion, depth), and DLSS or FSR themselves.
group.Upscaler = composite2 dlss fsr
# The bloom's levels, down and back up.
group.Bloom = composite3 composite4 composite5 composite6 composite7 composite8 composite9 composite10 composite11 composite12 composite13
# The tone curve and the grade, at the window's size.
group.Final = final
