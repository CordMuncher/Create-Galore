[[mods]]
modId = "create_galore_bridge"
version = "1.150.0"
displayName = "Create Galore Bridge"
authors = "Create Galore"
description = '''Pack glue for Create Galore: one wear screen for every accessory (the Curios, Accessories and The Aether slots behind one inventory button, with limits on how many of each a person can wear and a show/hide eye per slot), Jade names the smog and filtered exhaust you look at and how thick it is, a Create-style exhaust system for Pollution of the Realms smog (filter frames that catch every kind of smog with no filter material or upkeep, iron slowest and diamond fastest, and let out filtered exhaust which must rise into the open sky, pressure that forces trapped smog up through ceiling filters, smog from fan bulk smelting and smoking, belts with casing that seal a wall, doors and trapdoors cased with Andesite, Brass or Copper Casing that seal against smog while shut and open only by redstone, Advanced Chimneys pumps driven by an Encased Fan), TFMG engines and blast furnaces pollute (Create: Smog) only while they burn fuel, Blaze Burners only while they have fuel, the Stellar Core item that gates space travel, compasses that find the Twilight Forest boss lairs on the way to it, removal of outdated Field Guide copies from inventories, Aeronautics Winds weather effects that no longer load chunks on the server thread or freeze lakes in warm biomes and seasons, a Dimensional Drive that reads and jumps its own ship when several ships are loaded, players who log out on a ship built since the last world save held in place until the ship loads instead of dropped from the sky, Aeronautics Discovery flyovers that despawn and Soaring Traders that pick their structure map without freezing the server, Field Guide page titles that stay on the paper, two join-chat notices (Train Utilities rename, Toolgun recommendation) kept out of chat, readable name tags under Iris shader packs, polluted water that shader packs draw as water and that sits flush with the clean water around it, fruit picked from leaves that Create Dupe Fix no longer deletes, Thirst Was Taken healing that follows the Cataclysm Nature Heal attribute, the pack's 0.2.1 key rebinds moved into games installed before 0.2.1, Field Guide section tabs that fit the screen, a Flight Control tool gun status line that no longer covers the hearts, Aeronautics Winds' third-person glider camera working on 1.21.1, TFMG Large Transformers that give back their coils and steel when mined, hermit crabs that Hybrid Aquatic's hunters (otters, octopuses, crab-eating fish) leave alone, the Field Guide's voice (Ask the Book: players ask Claude through the home server, with the server owner's own API key kept outside the server folder), players who log out on a seat on a ship, car, coaster cart or Create contraption (turning platform, cart, train carriage) sitting on it again when they log back in, Hostile Skies airship captains that count as killed only when a player hurt them and announce an accident otherwise, plus an op command to reset captain kills, a Field Guide that reopens on its map after you leave a page, Inventory Profiles Next hotkeys that stay quiet while you type in JEI's search box or any other text box, an experimental, off-by-default 10-bit game window, and an experimental, off-by-default DirectX presentation mode for Windows (ported from Perfect Presentation by sidit77, MIT), experimental NVIDIA Reflex low latency on that DirectX device, GPU pacing that keeps frames from queueing on any graphics card, a frame counter, a GPU cost meter that times every shader pass, and a Deep Seas Pixel light style shader that NVIDIA and Mesa drivers accept.'''

