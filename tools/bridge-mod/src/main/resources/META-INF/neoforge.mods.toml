[[mods]]
modId = "create_galore_bridge"
version = "1.36.0"
displayName = "Create Galore Bridge"
authors = "Create Galore"
description = '''Pack glue for Create Galore: TFMG engines and blast furnaces pollute (Create: Smog) only while they burn fuel, Blaze Burners only while they have fuel, the Stellar Core item that gates space travel, compasses that find the Twilight Forest boss lairs on the way to it, removal of outdated Field Guide copies from inventories, Aeronautics Winds weather effects that no longer load chunks on the server thread or freeze lakes in warm biomes and seasons, a Dimensional Drive that reads and jumps its own ship when several ships are loaded, Field Guide page titles that stay on the paper, two join-chat notices (Train Utilities rename, Toolgun recommendation) kept out of chat, readable name tags under Iris shader packs, fruit picked from leaves that Create Dupe Fix no longer deletes, Thirst Was Taken healing that follows the Cataclysm Nature Heal attribute, the pack's 0.2.1 key rebinds moved into games installed before 0.2.1, Field Guide section tabs that fit the screen, a Flight Control tool gun status line that no longer covers the hearts, Aeronautics Winds' third-person glider camera working on 1.21.1, TFMG Large Transformers that give back their coils and steel when mined, hermit crabs that Hybrid Aquatic's hunters (otters, octopuses, crab-eating fish) leave alone, the Field Guide's voice (Ask the Book: players ask Claude through the home server, with the server owner's own API key kept outside the server folder), Hostile Skies airship captains that count as killed only when a player hurt them and announce an accident otherwise, plus an op command to reset captain kills, a Field Guide that reopens on its map after you leave a page, Inventory Profiles Next hotkeys that stay quiet while you type in JEI's search box or any other text box, an experimental, off-by-default 10-bit game window, and an experimental, off-by-default DirectX presentation mode for Windows (ported from Perfect Presentation by sidit77, MIT).'''

[[mixins]]
config = "create_galore_bridge.mixins.json"

[[mixins]]
config = "create_galore_bridge.presentation.mixins.json"

