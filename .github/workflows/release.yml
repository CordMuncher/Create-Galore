# Builds everything needed to play and to run a server, and publishes it as the GitHub release
# for the pack version in pack/pack.toml (tag v<version>, e.g. v0.1.2).
#   Create-Galore-<v>.mrpack                  the pack, built fresh from pack/ (import in Prism or the Modrinth App)
#   Create-Galore-Server-Setup-<v>.exe        Windows app that builds a dedicated server (mods download automatically)
#   Create-Galore-<v>-server-kit.zip          README, docs, pack/ and the install-server scripts (Linux, macOS, manual setups)
#   README.md
#   Create-Galore-icon.png                    the pack icon, to set on the launcher instance (a .mrpack can't carry one)
#   Create-Galore-Updater.zip                 the pre-launch updater, for instances imported before the .mrpack carried it
#   create-galore-updater.jar                 the same updater on its own; servers run it at start to ask about updates
#   Create-Galore-pack-info.txt               version and checksum of this release's pack, read by that check
# Twilight Forest isn't included anywhere: it's CurseForge-only, so players and the app add it by hand.
#
# A push to main-6fi2ef that touches the pack, the server files, the app or the docs rebuilds the release
# for the current version. Same version again: the files are replaced and the tag moves to the new commit.
# Pull requests only build and check, they never publish.
name: Release

on:
  push:
    branches: [main-6fi2ef]
    paths:
      - 'pack/**'
      - 'server/**'
      - 'docs/**'
      - 'README.md'
      - 'MODS.md'
      - 'CHANGELOG.md'
      - 'tools/server-setup/**'
      - 'tools/build_server_bundle.py'
      - 'tools/updater/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'pack/**'
      - 'CHANGELOG.md'
      - 'server/**'
      - 'tools/server-setup/**'
      - 'tools/build_server_bundle.py'
      - 'tools/updater/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack, server kit and app data
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mods: ${{ steps.bundle.outputs.mods }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pack version
        id: version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pack/pack.toml','rb'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Pack version $v"

      - name: Check CHANGELOG.md has notes for this version
        run: python3 tools/changelog_section.py "${{ steps.version.outputs.version }}"

      - name: Build the app's server data (fails if pack/index.toml is stale)
        id: bundle
        run: |
          python3 tools/build_server_bundle.py dist/bundle
          # Downloaded mods plus jars shipped as pack files (the pack's own Create Galore Bridge).
          echo "mods=$(( $(wc -l < dist/bundle/server-manifest.tsv) + $(find pack/mods -maxdepth 1 -name '*.jar' | wc -l) ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build the .mrpack with packwiz
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          go install github.com/packwiz/packwiz@latest
          mkdir -p dist/release
          out="dist/release/Create-Galore-$V.mrpack"
          # packwiz can silently leave out a mod when a download lookup hiccups, so check the count and retry.
          want=$(grep -c '^metafile = true' pack/index.toml)
          for try in 1 2 3; do
            (cd pack && "$(go env GOPATH)/bin/packwiz" modrinth export -o "../$out")
            got=$(unzip -p "$out" modrinth.index.json | python3 -c "import json,sys; print(len(json.load(sys.stdin)['files']))")
            echo "mrpack lists $got of $want mods, shaders and resource packs"
            [ "$got" = "$want" ] && exit 0
          done
          echo "::error::packwiz export kept missing files"; exit 1

      - name: Add the in-place updater to the .mrpack
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # Pinned versions, checked by hash. The launcher's pre-launch hook runs them with --bootstrap-no-update,
          # so players never depend on the GitHub API. See "Updating" in the README.
          mkdir -p dist/updater/overrides
          cd dist/updater/overrides
          curl -fsSL -o packwiz-installer-bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar
          curl -fsSL -o packwiz-installer.jar https://github.com/packwiz/packwiz-installer/releases/download/v0.5.14/packwiz-installer.jar
          sha256sum -c - <<'SUMS'
          a8fbb24dc604278e97f4688e82d3d91a318b98efc08d5dbfcbcbcab6443d116c  packwiz-installer-bootstrap.jar
          c9f646908d340d84773948a9a7d98bc1dae250d35e1016dc6e2b8459760b5598  packwiz-installer.jar
          SUMS
          cd ../../..
          tools/updater/build.sh dist/updater/overrides
          cd dist/updater
          jars="packwiz-installer-bootstrap.jar packwiz-installer.jar create-galore-updater.jar"
          zip -q "../release/Create-Galore-$V.mrpack" $(printf 'overrides/%s ' $jars)
          (cd overrides && zip -q ../../release/Create-Galore-Updater.zip $jars)
          unzip -l "../release/Create-Galore-$V.mrpack" | grep packwiz-installer
          # Servers: the app embeds the jar and writes it next to start-server; the check reads the pack info.
          cp overrides/create-galore-updater.jar ../bundle/
          cp overrides/create-galore-updater.jar ../release/
          cp ../bundle/pack-info.txt ../release/Create-Galore-pack-info.txt

      - name: Build the server kit
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          kit="Create-Galore-$V-server-kit"
          mkdir -p "dist/$kit"
          cp -r README.md MODS.md docs pack server "dist/$kit/"
          cp dist/updater/overrides/create-galore-updater.jar "dist/$kit/server/"
          (cd dist && zip -qr "release/$kit.zip" "$kit")
          cp README.md dist/release/README.md
          cp docs/icon-512.png dist/release/Create-Galore-icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/release

  app:
    name: Server Setup app (Windows)
    needs: pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build tools/server-setup/CreateGaloreServerSetup.csproj -c Release "-p:BundleDir=${{ github.workspace }}/bundle"

      - name: Check the exe loads its pack data
        shell: pwsh
        run: |
          $exe = "tools/server-setup/bin/Release/net48/Create-Galore-Server-Setup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--check","--log","check.txt" -Wait -PassThru
          Get-Content check.txt
          if ($p.ExitCode -ne 0) { throw "exe check failed with exit code $($p.ExitCode)" }
          New-Item -ItemType Directory -Force app | Out-Null
          Copy-Item $exe "app/Create-Galore-Server-Setup-${{ needs.pack.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app

  release:
    name: Publish release
    needs: [pack, app]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main-6fi2ef'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4   # CHANGELOG.md and tools/changelog_section.py for the notes
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: out

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.pack.outputs.version }}
        run: |
          tag="v$V"
          ls -la out
          # What changed comes first, from this version's CHANGELOG.md section; then how to play.
          { python3 tools/changelog_section.py "$V"; echo; echo '---'; echo; } > changes.md
          cat > notes.md <<EOF
          **Create Galore $V** · Minecraft 1.21.1 · NeoForge 21.1.262 (don't update NeoForge)

          ### Play
          1. Download **Create-Galore-$V.mrpack** and import it in Prism Launcher or the Modrinth App.
          2. Add **twilightforest-1.21.1-4.8.3345-universal.jar** from [CurseForge](https://www.curseforge.com/minecraft/mc-mods/the-twilight-forest/files/all?version=1.21.1) to the instance's \`mods\` folder. It's CurseForge-only, so it can't be in the pack.
          3. Give the game 8 GB of RAM.
          4. Optional: set the instance icon to **Create-Galore-icon.png** (Prism: click the instance icon; Modrinth App: instance settings). Launchers can't take an icon from a .mrpack.

          ### Update an instance you already have (no reinstall)
          Set this once as the instance's pre-launch command (Prism: Edit → Settings → Custom commands):
          \`"\$INST_JAVA" -jar create-galore-updater.jar\`
          From then on every launch fetches only the mods and configs that changed, removes mods the pack dropped and keeps your keybinds, Distant Horizons, Subtle Effects and other settings. Add \`--clean\` to the end of the command to reset every config to the pack's on each launch instead (bug hunting; mods and worlds stay). An instance imported before the updater shipped (no \`create-galore-updater.jar\` in its \`minecraft\` folder) first needs the three jars from **Create-Galore-Updater.zip** put there. Details in the README under *Updating*.

          ### Run a server (Windows)
          Download **Create-Galore-Server-Setup-$V.exe** and run it (Windows may ask you to confirm because the app isn't signed: More info → Run anyway). Pick a folder and the memory, drop in the Twilight Forest jar, tick the EULA and press Install. It installs NeoForge, downloads the 182 server-side mods from Modrinth (or copies them from a mods folder you drop in), and sets up configs, memory, whitelist and a start script. It downloads Java 21 into the server folder if your PC doesn't have it. Each time \`start-server.bat\` starts, it checks for a newer pack and asks in the console whether to update: no, yes, or back up the world first (into the \`backups\` folder) and then update. It never updates without asking. Updating keeps the world, your settings and any config you edited that the pack didn't change. Running a newer version of the app on the same folder does the same update.

          ### Run a server (Linux, macOS, or by hand)
          **Create-Galore-$V-server-kit.zip** has the README, the server guide (\`docs/server-setup.md\`), the pack source and the \`install-server\` scripts.

          Built from ${GITHUB_SHA::7}.
          EOF
          cat changes.md notes.md > notes-full.md && mv notes-full.md notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            # Same version rebuilt: move the tag to this commit and replace the files.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --title "Create Galore $V" --notes-file notes.md --latest
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Create Galore $V" --notes-file notes.md --latest
          fi

  app-install-test:
    name: App builds a real server (Windows)
    # Full run of the app on a clean Windows machine: Java download, NeoForge install, 182 mod downloads plus the pack's own jar.
    # Only on pull requests and manual runs, so publishing doesn't wait on it.
    needs: [pack, app]
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app
      - name: Install a server with the app
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app/*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "galore-server"
          $p = Start-Process -FilePath $exe -ArgumentList "--install",$dir,"--memory","4","--eula","--log","install.txt" -Wait -PassThru
          Get-Content install.txt | Where-Object { $_ -notmatch '^  ' }
          if ($p.ExitCode -ne 0) { throw "install failed with exit code $($p.ExitCode)" }
          $mods = (Get-ChildItem "$dir/mods/*.jar").Count
          Write-Host "$mods mods installed"
          if ($mods -ne ${{ needs.pack.outputs.mods }}) { throw "expected ${{ needs.pack.outputs.mods }} mods" }
          foreach ($f in "start-server.bat","run.bat","server.properties","user_jvm_args.txt","eula.txt","config/paxi/datapacks/create-galore-tweaks/pack.mcmeta") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          if (-not (Select-String -Path "$dir/server.properties" -Pattern '^allow-flight=true$' -Quiet)) { throw "allow-flight not set" }
          if (-not (Select-String -Path "$dir/user_jvm_args.txt" -Pattern '^-Xmx4G$' -Quiet)) { throw "memory not set" }
          foreach ($f in "create-galore-updater.jar",".galore-pack.txt") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          Get-Content "$dir/.galore-pack.txt"
          if (-not (Select-String -Path "$dir/.galore-pack.txt" -Pattern '^pack_sha256=[0-9a-f]{64}$' -Quiet)) { throw "no pack checksum for the update check" }
          Get-Content "$dir/start-server.bat"

      - name: Update the same server with --update (what the start-up check runs)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app/*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "galore-server"
          $p = Start-Process -FilePath $exe -ArgumentList "--update",$dir,"--log","update.txt" -Wait -PassThru
          Get-Content update.txt | Where-Object { $_ -notmatch '^  ' }
          if ($p.ExitCode -ne 0) { throw "update failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$dir/user_jvm_args.txt" -Pattern '^-Xmx4G$' -Quiet)) { throw "--update changed the memory" }
          if (-not (Select-String -Path update.txt -Pattern ': 0 downloaded' -Quiet)) { throw "--update downloaded mods again" }

      - name: --update while the update check holds its jar open (as when start-server runs it)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app/*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "galore-server"
          $jar = Join-Path $dir "create-galore-updater.jar"
          [IO.File]::AppendAllText($jar, "x")   # an older jar, so the update wants to replace it
          $lock = [IO.File]::Open($jar, 'Open', 'Read', 'Read')   # Java keeps a running jar open like this
          try {
            $p = Start-Process -FilePath $exe -ArgumentList "--update",$dir,"--log","update2.txt" -Wait -PassThru
            Get-Content update2.txt | Where-Object { $_ -notmatch '^  ' }
            if ($p.ExitCode -ne 0) { throw "update with the jar in use failed with exit code $($p.ExitCode)" }
            if (-not (Test-Path "$jar.new")) { throw "the new jar wasn't staged as .new" }
          } finally { $lock.Close() }
          Push-Location $dir
          cmd /c "if exist create-galore-updater.jar.new move /y create-galore-updater.jar.new create-galore-updater.jar >nul"
          Pop-Location
          if (Test-Path "$jar.new") { throw "start-server's swap didn't take the new jar" }
          if (-not (Select-String -Path "$dir/start-server.bat" -Pattern 'create-galore-updater.jar.new' -Quiet)) { throw "start-server.bat doesn't swap in a staged jar" }

      - name: Start-up update check runs and lets the server start
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "galore-server"
          $java = if (Test-Path "$dir/java/bin/java.exe") { "$dir/java/bin/java.exe" } else { "java" }
          Push-Location $dir
          # No console here, so it must report and start, never wait for an answer.
          & $java -jar create-galore-updater.jar --server-start
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "update check exited with $code" }
